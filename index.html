<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <style>
        body {
            font-family: sans-serif;
            background: #222;
            color: #eee;
        }

        #login {
            max-width: 360px;
            margin: 60px auto;
        }

        #login label {
            display: block;
            margin-bottom: 12px;
        }

        #login input[type=text],
        #login input[type=password] {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 4px;
        }

        #login .mode-choice {
            display: inline;
        }

        #login-error {
            color: #f66;
        }
    </style>
</head>

<body>
    <div id="login">
        <h2>Join a game</h2>
        <form id="login-form">
            <label>
                Coach name
                <input type="text" id="login-coach" required>
            </label>
            <label>
                Password
                <input type="password" id="login-password">
            </label>
            <label>
                Game ID
                <input type="text" id="login-gameid" placeholder="leave blank to spectate any active game">
            </label>
            <label class="mode-choice">
                <input type="radio" name="login-mode" value="spectator" checked> Spectate
            </label>
            <label class="mode-choice">
                <input type="radio" name="login-mode" value="player"> Play
            </label>
            <p id="login-error"></p>
            <button type="submit">Connect</button>
        </form>
    </div>

    <div class="phaserapppage" id="wrapper" style="display: none">
        <div id="phaserapp"></div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function (event) {
            event.preventDefault();

            var coach = document.getElementById('login-coach').value;
            var password = document.getElementById('login-password').value;
            var gameId = document.getElementById('login-gameid').value;
            var mode = document.querySelector('input[name=login-mode]:checked').value;

            var wrapper = document.getElementById('wrapper');
            wrapper.setAttribute('user', coach);
            wrapper.setAttribute('password', password);
            wrapper.setAttribute('game', gameId);
            wrapper.setAttribute('mode', mode);

            document.getElementById('login').style.display = 'none';
            wrapper.style.display = 'block';

            new EntryPoint.default(function () {
                wrapper.style.display = 'none';
                document.getElementById('login').style.display = 'block';
            });
        });
    </script>
</body>

</html>
